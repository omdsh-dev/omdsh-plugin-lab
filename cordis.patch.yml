# Oh My DSH Plugin Lab is local-only until a deployment explicitly enables
# closed-packet sharing and configures an HTTPS ingest endpoint.
- insert:
    - id: omdsh-plugin-lab
      name: '@oh-my-dsh/plugin-lab'
      config:
        allowShare: false
        authorizationEnv: OMDSH_PLUGIN_LAB_TOKEN
        requestTimeoutMs: 5000
        retryIntervalMs: 30000
