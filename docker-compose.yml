services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: plugin_lab
      POSTGRES_USER: plugin_lab
      POSTGRES_PASSWORD: plugin_lab
    ports:
      - "5432:5432"
    volumes:
      - plugin-lab-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plugin_lab"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  plugin-lab-postgres:
